<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}MyFans 下载器{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236d5dfc'/%3E%3Cpath d='M15 46V18h8l9 15 9-15h8v28h-8V31l-9 14-9-14v15z' fill='white'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand: #6d5dfc;
            --brand-deep: #5545e8;
            --brand-soft: #efedff;
            --ink: #1f2937;
            --muted: #667085;
            --line: #e7e9f2;
            --surface: rgba(255, 255, 255, .92);
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            color: var(--ink);
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
            background:
                radial-gradient(circle at 8% 5%, rgba(109, 93, 252, .14), transparent 31rem),
                radial-gradient(circle at 92% 16%, rgba(73, 190, 170, .12), transparent 28rem),
                #f6f7fb;
        }
        .app-nav {
            background: rgba(255, 255, 255, .88);
            border-bottom: 1px solid rgba(231, 233, 242, .9);
            backdrop-filter: blur(18px);
        }
        .brand-mark {
            display: inline-grid;
            width: 2.25rem;
            height: 2.25rem;
            margin-right: .65rem;
            place-items: center;
            color: #fff;
            font-weight: 800;
            border-radius: .8rem;
            background: linear-gradient(135deg, var(--brand), #8f65f8);
            box-shadow: 0 8px 18px rgba(109, 93, 252, .28);
        }
        .navbar-brand { color: var(--ink); font-weight: 750; letter-spacing: -.02em; }
        .navbar-brand:hover { color: var(--ink); }
        .nav-link { color: var(--muted); border-radius: .65rem; padding: .55rem .9rem !important; }
        .nav-link:hover, .nav-link.active { color: var(--brand-deep); background: var(--brand-soft); }
        .page-shell { max-width: 1100px; padding-top: 6.5rem; padding-bottom: 3rem; }
        .glass-card {
            border: 1px solid rgba(231, 233, 242, .95);
            border-radius: 1.35rem;
            background: var(--surface);
            box-shadow: 0 20px 55px rgba(32, 39, 67, .08);
        }
        .eyebrow {
            color: var(--brand-deep);
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        .page-title { font-weight: 800; letter-spacing: -.04em; }
        .text-secondary { color: var(--muted) !important; }
        .form-label { margin-bottom: .5rem; font-size: .9rem; font-weight: 700; }
        .form-control, .form-select {
            min-height: 3rem;
            border-color: var(--line);
            border-radius: .85rem;
            background-color: rgba(255, 255, 255, .86);
        }
        .form-control:focus, .form-select:focus {
            border-color: rgba(109, 93, 252, .55);
            box-shadow: 0 0 0 .22rem rgba(109, 93, 252, .12);
        }
        .btn-brand {
            min-height: 3rem;
            color: #fff;
            font-weight: 750;
            border: 0;
            border-radius: .85rem;
            background: linear-gradient(135deg, var(--brand), var(--brand-deep));
            box-shadow: 0 10px 24px rgba(109, 93, 252, .24);
        }
        .btn-brand:hover, .btn-brand:focus { color: #fff; transform: translateY(-1px); }
        .btn-brand:disabled { transform: none; box-shadow: none; }
        .hidden { display: none !important; }
        @media (max-width: 767.98px) {
            .page-shell { padding-top: 5.75rem; }
            .glass-card { border-radius: 1rem; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-md fixed-top app-nav">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
                <span class="brand-mark">M</span>
                MyFans 下载器
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="展开导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-md-2 py-2 py-md-0">
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint == 'index' %} active{% endif %}" href="{{ url_for('index') }}">下载中心</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint in ['settings', 'settings_api'] %} active{% endif %}" href="{{ url_for('settings') }}">设置</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container page-shell">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
