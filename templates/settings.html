{% extends "base.html" %}

{% block title %}设置 · MyFans 下载器{% endblock %}

{% block head %}
<style>
    .settings-layout { max-width: 900px; margin: 0 auto; }
</style>
{% endblock %}

{% block content %}
<div class="settings-layout">
    <header class="mb-4">
        <div class="eyebrow mb-2">Preferences</div>
        <h1 class="page-title display-6 mb-2">下载设置</h1>
        <p class="text-secondary mb-0">配置会保存到本机，后续网页下载将自动使用这些选项。</p>
    </header>

    {% include '_settings_form.html' %}
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='settings.js') }}"></script>
{% endblock %}
